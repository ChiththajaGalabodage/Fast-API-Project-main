   <g id="text_1">
    <text style="font-weight: 700; font-size: 14px; font-family: 'Times New Roman', 'DejaVu Serif', serif; text-anchor: start; fill: #17324d" x="13.7952" y="23.731695" transform="rotate(-0 13.7952 23.731695)">Mapping of research questions, objectives and evaluation evidence</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 10px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #1f2933" transform="translate(48.285312 40.199569)">Primary RQ: How can an integrated LLM-driven framework improve the</text>
    <text style="font-weight: 700; font-size: 10px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #1f2933" transform="translate(59.657969 50.491131)">effectiveness, efficiency and reliability of continuous testing in CI/CD</text>
    <text style="font-weight: 700; font-size: 10px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #1f2933" transform="translate(185.24625 60.782694)">pipelines?</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #1f2933" transform="translate(21.347656 114.601068)">RQ1: How can LLMs improve continuous</text>
    <text style="font-size: 10px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #1f2933" transform="translate(51.621094 125.07263)">testing in CI/CD pipelines?</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #1f2933" transform="translate(215.944844 109.374661)">RQ2: How effective is LLM-based predictive</text>
    <text style="font-size: 10px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #1f2933" transform="translate(228.213594 119.846224)">test selection compared with traditional</text>
    <text style="font-size: 10px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #1f2933" transform="translate(287.916719 130.317786)">methods?</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #1f2933" transform="translate(32.739062 182.859976)">RO1: Design modular agents for test</text>
    <text style="font-size: 10px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #1f2933" transform="translate(24.982031 193.350289)">generation, predictive selection and self-</text>
    <text style="font-size: 10px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #1f2933" transform="translate(90.232812 203.840601)">healing.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #1f2933" transform="translate(218.92375 188.105133)">RO2: Empirically compare coverage, defect</text>
    <text style="font-size: 10px; font-family: 'Times New Roman', 'DejaVu Serif', serif; fill: #1f2933" transform="translate(237.524531 198.595445)">detection and execution efficiency.</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9.5px; font-family: 'Times New Roman', 'DejaVu Serif', serif; text-anchor: middle; fill: #1f2933" x="206.64" y="258.26176" transform="rotate(-0 206.64 258.26176)">Evidence: prototype behaviour + controlled traditional-versus-agentic experiment</text>
   </g>
  </g>
