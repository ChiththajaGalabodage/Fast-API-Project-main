name: CI/CD Pipeline
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  API-CI:
    name: API CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code changes
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Start API server
        run: |
          # Make sure the venv exists and is synced before we background anything.
          uv run python -c "print('venv ready')"

          # Run uvicorn directly from the venv (NOT via `uv run`) so there is no
          # long-lived `uv` parent process holding a lock on the uv cache.
          nohup .venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000 > server.log 2>&1 &
          echo $! > server.pid

          for i in {1..30}; do
            if curl -s -f http://localhost:8000/api/health > /dev/null; then
              echo "Server is up!"
              break
            fi
            echo "Waiting for server..."
            sleep 2
          done

          curl -sSf http://localhost:8000/api/health > /dev/null

      - name: Snapshot protected files before agent execution
        id: pre_agent_snapshot
        run: |
          mkdir -p reports
          git ls-files -z | while IFS= read -r -d '' file; do
            case "$file" in
              tests_generated/generated_test.py|reports/*) ;;
              *) sha256sum -- "$file" ;;
            esac
          done > reports/pre_agent_protected_files.sha256
          find .venv -type f -print0 | sort -z | xargs -0 sha256sum > reports/pre_agent_venv_files.sha256
          echo "source_manifest_sha=$(sha256sum reports/pre_agent_protected_files.sha256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "venv_manifest_sha=$(sha256sum reports/pre_agent_venv_files.sha256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Run test generator (LLM-driven test creation)
        id: test_generator
        continue-on-error: true
        env:
          # Never expose an LLM credential to pull-request-controlled code.
          OPENROUTER_API_KEY: ${{ (github.event_name != 'pull_request') && secrets.OPENROUTER_API_KEY || '' }}
          GEMINI_MODEL: google/gemini-2.5-flash
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          # The generator fetches OpenAPI spec, calls LLM, writes tests, and runs pytest with coverage
          .venv/bin/python tests_generated/generator.py

      - name: Verify generator protected-file integrity
        id: generator_integrity
        if: always()
        run: |
          test -f reports/pre_agent_protected_files.sha256
          test -f reports/pre_agent_venv_files.sha256
          echo "${{ steps.pre_agent_snapshot.outputs.source_manifest_sha }}  reports/pre_agent_protected_files.sha256" | sha256sum --check --status -
          echo "${{ steps.pre_agent_snapshot.outputs.venv_manifest_sha }}  reports/pre_agent_venv_files.sha256" | sha256sum --check --status -
          find .venv -type f -print0 | sort -z | xargs -0 sha256sum > reports/post_agent_venv_files.sha256
          cmp -s reports/pre_agent_venv_files.sha256 reports/post_agent_venv_files.sha256 || {
            echo "Generated tests added, removed, or changed Python-environment files."
            exit 1
          }
          sha256sum --check --status reports/pre_agent_protected_files.sha256 || {
            echo "Test generation changed a protected repository file."
            exit 1
          }
          sha256sum --check --status reports/pre_agent_venv_files.sha256 || {
            echo "Generated tests changed the Python environment."
            exit 1
          }
          unexpected_python="$(git ls-files --others --exclude-standard -- '*.py')"
          if [ -n "$unexpected_python" ]; then
            echo "Generated tests created unexpected Python source files:"
            echo "$unexpected_python"
            exit 1
          fi

      - name: Upload Test Generator Results Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generator-test-results
          path: reports/generated_test_results.csv
          retention-days: 7

      - name: Validate self-healing guardrails
        if: always() && steps.generator_integrity.outcome == 'success'
        run: uv run pytest tests/test_self_healing.py -q -p no:cacheprovider

      - name: Run traditional application-test baseline
        id: traditional_baseline
        continue-on-error: true
        if: always() && steps.generator_integrity.outcome == 'success'
        run: |
          uv run python tests_selecter/run_test_batch.py \
            --csv-out test-results.csv \
            --timing-out reports/traditional_timing.json \
            --label traditional-full-suite \
            --expected-count 78 \
            --verbose \
            tests/test.py \
            tests/test_extended.py \
            tests_generated/generated_test.py

      - name: Upload Test Results Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: |
            test-results.csv
            reports/traditional_timing.json
          retention-days: 7

      - name: Run test selector with self-healing (predictive test selection)
        if: always() && steps.generator_integrity.outcome == 'success'
        env:
          # Autonomous LLM actions run only for trusted push/manual events.
          OPENROUTER_API_KEY: ${{ (github.event_name != 'pull_request') && secrets.OPENROUTER_API_KEY || '' }}
          GEMINI_MODEL: google/gemini-2.5-flash
        run: |
          mkdir -p reports
          git rev-parse HEAD > reports/source_head_before.txt
          git status --short > reports/worktree_status_before.txt
          git ls-files -z | while IFS= read -r -d '' file; do
            case "$file" in
              tests/test.py|tests/test_extended.py|tests_generated/generated_test.py|reports/*) ;;
              *) sha256sum -- "$file" ;;
            esac
          done > reports/protected_files_before.sha256

          # Get diff from the last commit (or against origin/main for PRs)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff "${{ github.event.pull_request.base.sha }}"...HEAD > /tmp/diff.txt
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git diff "${{ github.event.before }}" HEAD > /tmp/diff.txt
          else
            git show --format= --no-ext-diff HEAD > /tmp/diff.txt
          fi

          # Repairs are safety-checked, validated twice, checked against the
          # complete selected batch, and rolled back on any regression.
          uv run python tests_selecter/selecter.py \
            --diff /tmp/diff.txt \
            --run-medium \
            --min-tests 16 \
            --max-tests 16 \
            --max-heal-functions 3 \
            --heal-validation-runs 2 \
            --batch-timeout 300 \
            --failure-csv test-results.csv \
            --before-csv reports/agentic_before_heal.csv \
            --csv-out reports/test_results.csv \
            --timing-out reports/agentic_timing.json \
            --healing-report reports/self_healing_report.json \
            --healing-patch reports/self_healing.patch \
            --healing-backup-dir reports/self_healing_backups

      - name: Record self-healing audit state
        if: always()
        run: |
          mkdir -p reports
          git rev-parse HEAD > reports/source_head_after.txt
          git status --short > reports/worktree_status_after.txt
          if [ -f reports/source_head_before.txt ]; then
            cmp -s reports/source_head_before.txt reports/source_head_after.txt || {
              echo "Self-healing must not create or change commits."
              exit 1
            }
          fi
          if [ -f reports/protected_files_before.sha256 ]; then
            sha256sum --check --status reports/protected_files_before.sha256 || {
              echo "Self-healing changed a protected repository file."
              exit 1
            }
          fi

      - name: Verify selector artifact contract
        if: always()
        run: |
          for artifact in \
            reports/agentic_before_heal.csv \
            reports/test_results.csv \
            reports/agentic_timing.json \
            reports/self_healing_report.json \
            reports/self_healing.patch; do
            test -f "$artifact" || {
              echo "Missing mandatory selector artifact: $artifact"
              exit 1
            }
          done

      - name: Run authoritative secret-free suite after healing
        if: always() && steps.generator_integrity.outcome == 'success'
        run: |
          uv run python tests_selecter/run_test_batch.py \
            --csv-out reports/final_suite_after_heal.csv \
            --timing-out reports/final_suite_timing.json \
            --label final-suite-after-healing \
            --expected-count 106 \
            --verbose \
            tests/test.py \
            tests/test_extended.py \
            tests/test_self_healing.py \
            tests_generated/generated_test.py

      - name: Upload Test Selector Results Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selector-test-results
          path: |
            reports/agentic_before_heal.csv
            reports/test_results.csv
            reports/agentic_timing.json
            reports/self_healing_report.json
            reports/self_healing.patch
            reports/self_healing_backups/
            reports/source_head_before.txt
            reports/source_head_after.txt
            reports/worktree_status_before.txt
            reports/worktree_status_after.txt
            reports/protected_files_before.sha256
            reports/pre_agent_protected_files.sha256
            reports/pre_agent_venv_files.sha256
            reports/post_agent_venv_files.sha256
            reports/final_suite_after_heal.csv
            reports/final_suite_timing.json
          retention-days: 7

      - name: Generate traditional vs agentic comparison report
        if: always() && steps.generator_integrity.outcome == 'success'
        run: |
          uv run python tests_selecter/comparison_report.py \
            test-results.csv \
            reports/test_results.csv \
            reports/comparison_report.csv \
            reports/traditional_timing.json \
            reports/agentic_timing.json

      - name: Upload Comparison Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comparison-report
          path: reports/comparison_report.csv
          retention-days: 7

      - name: Upload server log (for debugging)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-server-log
          path: server.log
          retention-days: 7

      - name: Stop API server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" 2>/dev/null || true
            sleep 1
          fi
          # Belt-and-suspenders: catch anything matching by name too.
          pkill -9 -f "uvicorn main:app" 2>/dev/null || true
          sleep 1

      - name: Debug - check for lingering uv/uvicorn processes
        if: always()
        run: ps aux | grep -E "uv|uvicorn" | grep -v grep || echo "none found"
